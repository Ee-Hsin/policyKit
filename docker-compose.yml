services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: policykit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - policykit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d policykit"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  policykit-postgres:
